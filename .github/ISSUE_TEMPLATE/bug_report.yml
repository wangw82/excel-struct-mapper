name: Bug report
description: Report a reproducible defect in a released version
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove confidential data from all examples. Report security vulnerabilities through the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version, release tag, or commit identifier
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Reading
        - Writing
        - Schema and mapping
        - Conversion and validation
        - Documentation
        - Build or automation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem and its impact
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible sequence and sanitized input shape
      placeholder: |
        1. Define a schema with ...
        2. Read a worksheet containing ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized error output when useful
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime version, and relevant spreadsheet format
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials, personal data, internal names, and confidential spreadsheet content.
          required: true
        - label: This is not a security vulnerability.
          required: true
