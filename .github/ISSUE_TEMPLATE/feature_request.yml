name: Feature request
description: Propose a use case or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before prescribing an API. Examples must contain only synthetic or sanitized data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult or impossible today, and who is affected?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Provide a sanitized input shape and expected result when applicable
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds or simpler alternatives
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security considerations
      description: Note file formats, scale, API impact, untrusted input, or privacy concerns
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the roadmap.
          required: true
        - label: I removed private, personal, and organization-specific identifiers.
          required: true
